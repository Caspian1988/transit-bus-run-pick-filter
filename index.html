<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ride On Bid Filter & Pay Calculator by Ramin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --panel-2: #212c39;
      --border-color: #334155;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --badge-split: #f59e0b;
      --badge-straight: #10b981;
      --badge-4day: #8b5cf6;
      --amber: #ffb020;
      --go: #3dd68c;
      --mono: 'JetBrains Mono', monospace;
      --disp: 'Oswald', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      padding-bottom: 140px;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 20px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--accent-color);
    }

    .stats-bar {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .controls-panel {
      max-width: 1200px;
      margin: 0 auto 20px auto;
      background-color: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-group label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    input, select {
      background-color: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-color);
    }

    .picks-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    .pick-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s, transform 0.2s;
    }

    .pick-card:hover {
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .pick-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--text-main);
    }

    .pay-hours {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .badge-container {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-split { background-color: rgba(245, 158, 11, 0.2); color: var(--badge-split); }
    .badge-straight { background-color: rgba(16, 185, 129, 0.2); color: var(--badge-straight); }
    .badge-4day { background-color: rgba(139, 92, 246, 0.2); color: var(--badge-4day); }

    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }

    .schedule-table th, .schedule-table td {
      padding: 4px 6px;
      text-align: left;
    }

    .schedule-table th {
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
    }

    .schedule-table tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .off-day {
      color: var(--text-muted);
      font-style: italic;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
      font-size: 0.85rem;
    }

    .calc-btn {
      background-color: rgba(56, 189, 248, 0.15);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .calc-btn:hover {
      background-color: var(--accent-color);
      color: #000;
    }

    .compare-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }

    /* Floating Pay Calculator Extension Box */
    .calc-widget {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 320px;
      background: #19222d;
      border: 2px solid var(--amber);
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      z-index: 1000;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .calc-widget.collapsed .calc-body {
      display: none;
    }

    .calc-header {
      background: #000;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border-bottom: 1px solid var(--border-color);
    }

    .calc-title {
      font-family: var(--disp);
      color: var(--amber);
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .calc-toggle {
      color: var(--amber);
      font-weight: bold;
      font-size: 16px;
    }

    .calc-body {
      padding: 14px;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .calc-grid label {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .calc-grid input {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 6px;
      color: #fff;
      font-family: var(--mono);
      font-size: 13px;
    }

    .calc-row {
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 11px;
      padding: 4px 0;
      border-bottom: 1px solid var(--panel-2);
    }

    .calc-result {
      background: rgba(61, 214, 140, 0.05);
      border: 1px dashed var(--border-color);
      border-radius: 6px;
      padding: 10px;
      margin-top: 10px;
      text-align: center;
    }

    .calc-result .val {
      font-family: var(--disp);
      font-size: 26px;
      color: var(--go);
      font-weight: 700;
    }

    /* Comparison Dock */
    .compare-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 360px;
      background-color: #020617;
      border-top: 2px solid var(--accent-color);
      padding: 12px 20px;
      display: none;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
      z-index: 900;
    }

    .compare-dock.active {
      display: block;
    }

    .dock-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dock-list {
      display: flex;
      gap: 10px;
      overflow-x: auto;
    }

    .dock-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .remove-dock-item {
      color: #ef4444;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

  <header>

    <div class="control-group">
      <label for="shiftTypeFilter">Shift Type</label>
      <select id="shiftTypeFilter">
        <option value="all">All Types</option>
        <option value="straight">Straight Runs</option>
        <option value="split">Split Runs (S)</option>
        <option value="4day">4-Day Workweek</option>
        <option value="pm">PM / Late Night Finishes</option>
      </select>
    </div>

    <div class="control-group">
      <label for="offDaysFilter">Days Off</label>
      <select id="offDaysFilter">
        <option value="all">Any Days Off</option>
        <option value="Sat-Sun">Sat & Sun Off</option>
        <option value="Sun-Mon">Sun & Mon Off</option>
        <option value="Fri-Sat">Fri & Sat Off</option>
        <option value="3days">3 Days Off</option>
      </select>
    </div>

    <div class="control-group">
      <label for="minPayFilter">Min. Weekly Pay</label>
      <select id="minPayFilter">
        <option value="0">All Hours</option>
        <option value="42">42+ Hours</option>
        <option value="45">45+ Hours</option>
        <option value="48">48+ Hours</option>
      </select>
    </div>

    <div class="control-group">
      <label for="sortBy">Sort By</label>
      <select id="sortBy">
        <option value="pick-asc">Pick Number (Ascending)</option>
        <option value="pay-desc">Pay Hours (Highest First)</option>
        <option value="on-asc">Earliest Start Time</option>
        <option value="off-asc">Earliest End Time</option>
      </select>
    </div>
  </div>

  <div class="picks-grid" id="picksGrid"></div>

  <!-- FLOATING OVERTIME CALCULATOR EXTENSION WIDGET -->
  <div class="calc-widget" id="calcWidget">
    <div class="calc-header" onclick="toggleWidget()">
      <span class="calc-title">⚡ Overtime Pay Matrix</span>
      <span class="calc-toggle" id="calcToggleBtn">−</span>
    </div>
    <div class="calc-body">
      <div class="calc-grid">
        <div>
          <label for="annualPay">Annual Base ($)</label>
          <input type="number" id="annualPay" placeholder="65000" value="65000" oninput="calculatePayroll()">
        </div>
        <div>
          <label for="totalHours">Weekly Hours</label>
          <input type="number" id="totalHours" value="47" step="0.1" oninput="calculatePayroll()">
        </div>
      </div>
      <div class="calc-row">
        <span>Base Rate:</span>
        <span id="baseRateOutput" style="font-weight:700;">$0.00 / hr</span>
      </div>
      <div class="calc-row">
        <span>OT Rate (1.5x):</span>
        <span id="otRateOutput" style="color:var(--amber); font-weight:700;">$0.00 / hr</span>
      </div>
      <div class="calc-row">
        <span>OT Hours:</span>
        <span id="otHoursOutput" style="color:var(--amber); font-weight:700;">7 hrs</span>
      </div>
      <div class="calc-result">
        <div style="font-family:var(--mono); font-size:10px; color:var(--text-muted); text-transform:uppercase;">Gross Weekly Pay</div>
        <div class="val" id="weeklyTotalOutput">$0.00</div>
        <div style="font-family:var(--mono); font-size:9px; color:var(--text-muted); margin-top:4px;">
          Annual Run-Rate: <span id="annualTotalOutput" style="color:#fff; font-weight:700;">$0.00</span>
        </div>
      </div>
    </div>
  </div>

  <div class="compare-dock" id="compareDock">
    <div class="dock-container">
      <div>
        <strong>Comparing Picks:</strong>
        <div class="dock-list" id="dockList" style="margin-top: 5px;"></div>
      </div>
      <button onclick="clearComparison()" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Clear Comparison</button>
    </div>
  </div>

    let comparedPicks = new Set();

    function parsePayHours(payStr) {
      if (!payStr) return 0;
      const parts = payStr.split('h');
      const hours = parseInt(parts[0], 10) || 0;
      const mins = parseInt(parts[1], 10) || 0;
      return hours + (mins / 60);
    }

    function parseTimeToMinutes(timeStr) {
      if (!timeStr) return 9999;
      let isPM = timeStr.includes('p') || timeStr.includes('x');
      let cleanTime = timeStr.replace(/[apx]/g, '');
      let [h, m] = cleanTime.split(':').map(Number);
      if (h === 12 && !timeStr.includes('x')) h = 0;
      if (isPM && h !== 12) h += 12;
      return h * 60 + m;
    }

    function getShiftAttributes(pick) {
      const days = Object.keys(pick.schedule);
      let workDays = 0;
      let isSplit = false;
      let isPM = false;
      let earliestOn = 9999;
      let earliestOff = 9999;

      days.forEach(day => {
        const shift = pick.schedule[day];
        if (shift) {
          workDays++;
          if (shift.run.includes('S')) isSplit = true;
          if (shift.off.includes('x') || parseInt(shift.off) >= 8) isPM = true;
          
          const onMin = parseTimeToMinutes(shift.on);
          const offMin = parseTimeToMinutes(shift.off);
          if (onMin < earliestOn) earliestOn = onMin;
          if (offMin < earliestOff) earliestOff = offMin;
        }
      });

      return { workDays, isSplit, isPM, earliestOn, earliestOff };
    }

    function renderCards() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const shiftType = document.getElementById('shiftTypeFilter').value;
      const offDays = document.getElementById('offDaysFilter').value;
      const minPay = parseFloat(document.getElementById('minPayFilter').value);
      const sortBy = document.getElementById('sortBy').value;

      let filtered = picksData.filter(p => {
        const attr = getShiftAttributes(p);
        const payNum = parsePayHours(p.payHours);

        if (searchVal) {
          const runNames = Object.values(p.schedule).map(s => s ? s.run : '').join(' ').toLowerCase();
          const pickStr = `pick ${p.pick} ${p.notes.toLowerCase()}`;
          if (!runNames.includes(searchVal) && !pickStr.includes(searchVal)) return false;
        }

        if (shiftType === 'split' && !attr.isSplit) return false;
        if (shiftType === 'straight' && attr.isSplit) return false;
        if (shiftType === '4day' && attr.workDays !== 4) return false;
        if (shiftType === 'pm' && !attr.isPM) return false;

        if (payNum < minPay) return false;

        if (offDays === 'Sat-Sun' && (p.schedule.Sat !== null || p.schedule.Sun !== null)) return false;
        if (offDays === 'Sun-Mon' && (p.schedule.Sun !== null || p.schedule.Mon !== null)) return false;
        if (offDays === 'Fri-Sat' && (p.schedule.Fri !== null || p.schedule.Sat !== null)) return false;
        if (offDays === '3days' && attr.workDays !== 4) return false;

        return true;
      });

      filtered.sort((a, b) => {
        const attrA = getShiftAttributes(a);
        const attrB = getShiftAttributes(b);
        if (sortBy === 'pick-asc') return a.pick - b.pick;
        if (sortBy === 'pay-desc') return parsePayHours(b.payHours) - parsePayHours(a.payHours);
        if (sortBy === 'on-asc') return attrA.earliestOn - attrB.earliestOn;
        if (sortBy === 'off-asc') return attrA.earliestOff - attrB.earliestOff;
      });

      document.getElementById('statsBar').innerText = `Showing ${filtered.length} of ${picksData.length} picks`;

      const grid = document.getElementById('picksGrid');
      grid.innerHTML = '';

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="no-results" style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">No picks match your active filters.</div>';
        return;
      }

      filtered.forEach(p => {
        const attr = getShiftAttributes(p);
        const card = document.createElement('div');
        card.className = 'pick-card';

        let badgesHtml = '';
        if (attr.isSplit) badgesHtml += `<span class="badge badge-split">Split Run</span>`;
        else badgesHtml += `<span class="badge badge-straight">Straight Run</span>`;
        if (attr.workDays === 4) badgesHtml += `<span class="badge badge-4day">4-Day Workweek</span>`;

        let rowsHtml = '';
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        days.forEach(day => {
          const s = p.schedule[day];
          if (s) {
            rowsHtml += `<tr>
              <td><strong>${day}</strong></td>
              <td>${s.run}</td>
              <td>${s.on}–${s.off}</td>
              <td>${s.pay}</td>
            </tr>`;
          } else {
            rowsHtml += `<tr>
              <td><strong>${day}</strong></td>
              <td colspan="3" class="off-day">OFF</td>
            </tr>`;
          }
        });

        const isChecked = comparedPicks.has(p.pick) ? 'checked' : '';
        const decimalHours = parsePayHours(p.payHours).toFixed(2);

        card.innerHTML = `
          <div>
            <div class="card-header">
              <span class="pick-title">Pick ${p.pick}</span>
              <span class="pay-hours">${p.payHours}</span>
            </div>
            <div class="badge-container">${badgesHtml}</div>
            <table class="schedule-table">
              <thead>
                <tr><th>Day</th><th>Run</th><th>Times</th><th>Pay</th></tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
          <div class="card-footer">
            <button class="calc-btn" onclick="sendToCalculator(${decimalHours})">Calculate Pay ➔</button>
            <label class="compare-btn">
              <input type="checkbox" ${isChecked} onchange="toggleCompare(${p.pick})" /> Compare
            </label>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    /* Calculator Integration Logic */
    function calculatePayroll() {
      const annualInput = document.getElementById('annualPay').value;
      const totalHoursInput = document.getElementById('totalHours').value;
      
      const baseRateOutput = document.getElementById('baseRateOutput');
      const otRateOutput = document.getElementById('otRateOutput');
      const otHoursOutput = document.getElementById('otHoursOutput');
      const weeklyTotalOutput = document.getElementById('weeklyTotalOutput');
      const annualTotalOutput = document.getElementById('annualTotalOutput');
      
      if (!annualInput || annualInput <= 0 || !totalHoursInput || totalHoursInput <= 0) {
        baseRateOutput.innerText = "$0.00 / hr";
        otRateOutput.innerText = "$0.00 / hr";
        otHoursOutput.innerText = "0 hrs";
        weeklyTotalOutput.innerText = "$0.00";
        annualTotalOutput.innerText = "$0.00";
        return;
      }

      const annualSalary = parseFloat(annualInput);
      const weeklyHours = parseFloat(totalHoursInput);
      
      const baseHourlyRate = annualSalary / 2080;
      let straightHours = weeklyHours > 40 ? 40 : weeklyHours;
      let otHours = weeklyHours > 40 ? weeklyHours - 40 : 0;
      
      const otHourlyRate = baseHourlyRate * 1.5;
      const grossWeeklyEarnings = (straightHours * baseHourlyRate) + (otHours * otHourlyRate);
      const grossAnnualEarnings = grossWeeklyEarnings * 52;
      
      baseRateOutput.innerText = `$${baseHourlyRate.toFixed(2)} / hr`;
      otRateOutput.innerText = `$${otHourlyRate.toFixed(2)} / hr`;
      otHoursOutput.innerText = `${otHours.toFixed(2)} hrs`;
      weeklyTotalOutput.innerText = `$${grossWeeklyEarnings.toFixed(2)}`;
      annualTotalOutput.innerText = `$${grossAnnualEarnings.toFixed(2)}`;
    }

    function sendToCalculator(hours) {
      document.getElementById('totalHours').value = hours;
      calculatePayroll();
      const widget = document.getElementById('calcWidget');
      widget.classList.remove('collapsed');
      document.getElementById('calcToggleBtn').innerText = '−';
    }

    function toggleWidget() {
      const widget = document.getElementById('calcWidget');
      widget.classList.toggle('collapsed');
      const btn = document.getElementById('calcToggleBtn');
      btn.innerText = widget.classList.contains('collapsed') ? '+' : '−';
    }

    function toggleCompare(pickNum) {
      if (comparedPicks.has(pickNum)) {
        comparedPicks.delete(pickNum);
      } else {
        comparedPicks.add(pickNum);
      }
      updateDock();
      renderCards();
    }

    function clearComparison() {
      comparedPicks.clear();
      updateDock();
      renderCards();
    }

    function updateDock() {
      const dock = document.getElementById('compareDock');
      const list = document.getElementById('dockList');
      if (comparedPicks.size === 0) {
        dock.classList.remove('active');
        return;
      }
      dock.classList.add('active');
      list.innerHTML = '';
      comparedPicks.forEach(pickNum => {
        const p = picksData.find(item => item.pick === pickNum);
        const item = document.createElement('div');
        item.className = 'dock-item';
        item.innerHTML = `
          <span>Pick ${p.pick} (${p.payHours})</span>
          <span class="remove-dock-item" onclick="toggleCompare(${p.pick})">&times;</span>
        `;
        list.appendChild(item);
      });
    }

    // Attach Event Listeners
    document.getElementById('searchInput').addEventListener('input', renderCards);
    document.getElementById('shiftTypeFilter').addEventListener('change', renderCards);
    document.getElementById('offDaysFilter').addEventListener('change', renderCards);
    document.getElementById('minPayFilter').addEventListener('change', renderCards);
    document.getElementById('sortBy').addEventListener('change', renderCards);

    // Initializations
    renderCards();
    calculatePayroll();
  </script>
